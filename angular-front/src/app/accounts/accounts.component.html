<div class="p-3">
  @if (accounts$|async; as accounts){
    <table class="table">
    <thead>
    <tr>
    <th>Id</th><th>Balance</th><th>Date</th><th>Type</th><th>CustomerId</th>
    </tr>
    </>thead>
    <tbody>
      @for (acc of accountList;track acc){
        <tr>
          <td>{{acc.id}}</td>
          <td>{{acc.balance}}</td>
          <td>{{acc.createdAt}}</td>
          <td>{{acc.type}}</td>
          <td>{{acc.customerId}}</td>

        </tr>
  }
    </table>

  }
</div>
