<div class="p-3">
  @if (loadService.isLoading()){
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  }
  @if (accounts$ | async; as state) {
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Balance</th>
        <th>Date</th>
        <th>Type</th>
        <th>CustomerId</th>
      </tr>
    </thead>
    <tbody>
      @for (acc of state.accounts; track acc.id) {
  <tr>
    <td>{{ acc.id }}</td>
    <td>{{ acc.balance }}</td>
    <td>{{ acc.createdAt }}</td>
    <td>{{ acc.type }}</td>
    <td>{{ acc.customerId }}</td>
  </tr>
  }
  </tbody>
</table>
  }
</div>
